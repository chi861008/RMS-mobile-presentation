name: Sync slide 19 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-slide-19-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and replace slide 19
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          def git_blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          path = Path('RMS 手機報表研究.html')
          original = path.read_bytes()
          if git_blob_sha(original) != 'c7ba7e088141c22c1822162aabb73a553e1a4e5a':
              raise SystemExit('The original presentation changed')
          slide = base64.b64decode('', validate=True)
          updated = original[:8685042] + slide + original[8691724:]
          if git_blob_sha(updated) != '1f19c2a68a2ef03f728e71199aeee45365633b9e':
              raise SystemExit('The result differs from the validated presentation')
          path.write_bytes(updated)
          PY
      - name: Commit the slide and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- '.github/workflows/sync-slide-19-once.yml'
          git add -- 'RMS 手機報表研究.html'
          git commit -m "Sync slide 19 in the full RMS presentation"
          git push origin HEAD:main
